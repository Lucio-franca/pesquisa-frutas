<link rel="stylesheet" href="pesquisa.css">


<form [formGroup]="formPesquisa" (ngSubmit)="onSubmit()">

    <input type="text" placeholder="Nome" formControlName="nome"><br><br>

    <input type="text" placeholder="Endereço" formControlName="endereco"><br><br>

    <input type="email" placeholder="Email" formControlName="email"><br><br>

    <p>Porções diárias:</p>

    <label><input type="radio" formControlName="porcoesDiarias" value="1"> 1</label>
    <label><input type="radio" formControlName="porcoesDiarias" value="2"> 2</label>
    <label><input type="radio" formControlName="porcoesDiarias" value="3+"> 3+</label>

    <br><br>

    <p>Frutas Preferidas:</p>

    <select formControlName="frutasPreferidas" multiple>
        <option *ngFor="let fruta of frutas" [value]="fruta">
            {{ fruta }}
        </option>
    </select>

    <br><br>

    <label>
        <input type="checkbox" formControlName="querPromocoes">
        Receber promoções
    </label>

    <br><br>

    <button type="submit">Enviar</button>

</form>
